# ============================================
# NETLIFY CONFIGURATION
# Flash Gordon - Arbitrage Dashboard
# ============================================

[build]
  # Directory with static files to publish
  publish = "public"
  
  # Build command (none needed for static files)
  command = "echo 'Static site - no build needed'"
  
  # Functions directory
  functions = "netlify/functions"

# Serverless Functions Configuration
[functions]
  # Use Node.js 18 for ESM support
  node_bundler = "esbuild"
  
  # Include node_modules for functions
  included_files = ["node_modules/**"]

# Environment variables (set these in Netlify dashboard for security)
# [build.environment]
#   ALCHEMY_API_KEY = "your_key_here"

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects for SPA routing (if needed in future)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Custom 404 page
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Dev server settings
[dev]
  port = 8888
  targetPort = 3000
  publish = "public"
  autoLaunch = true

